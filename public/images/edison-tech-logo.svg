<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="60" fill="transparent"/>

  <!-- Premium Icon with Gradient -->
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.05" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon Glow Circle -->
  <circle cx="30" cy="30" r="24" fill="url(#glowGradient)"/>

  <!-- Icon Main Circle with Gradient -->
  <circle cx="30" cy="30" r="18" fill="url(#iconGradient)" filter="url(#glow)"/>

  <!-- Lightning Bolt (Edison's Light Bulb Concept) - More refined -->
  <path d="M30 18 L26 28 L32 28 L28 42 L36 28 L30 28 Z" fill="white" fill-opacity="0.95"/>

  <!-- Subtle inner highlight -->
  <circle cx="30" cy="30" r="18" fill="none" stroke="white" stroke-width="0.5" opacity="0.3"/>

  <!-- Text "Edison Tech" with premium styling -->
  <text x="60" y="24" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#1E293B" letter-spacing="-0.02em">
    Edison Tech
  </text>
  <text x="60" y="40" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#64748B" letter-spacing="0.05em">
    PROJECT MANAGEMENT
  </text>

  <!-- Subtle accent line under tagline -->
  <line x1="60" y1="43" x2="110" y2="43" stroke="#3B82F6" stroke-width="1.5" opacity="0.2" stroke-linecap="round"/>
</svg>
