openapi: 3.0.3
info:
  title: Edison Tech Project Management API
  description: |
    Comprehensive API for managing projects, tasks, invoices, payments, and more.

    ## Authentication
    All API requests require authentication using Bearer tokens.
    Include the token in the Authorization header:
    ```
    Authorization: Bearer {your_token}
    ```

    ## Rate Limiting
    - API requests are limited to 60 requests per minute per user
    - Auth endpoints are limited to 5 requests per minute
    - Upload endpoints are limited to 10 requests per minute

    ## Error Responses
    All endpoints return consistent error responses:
    ```json
    {
      "message": "Error message",
      "errors": {
        "field": ["Validation error message"]
      }
    }
    ```
  version: 1.0.0
  contact:
    name: Edison Tech Support
    email: support@edisontech.example.com
  license:
    name: Proprietary
    url: https://edisontech.example.com/license

servers:
  - url: http://localhost/api
    description: Local development server
  - url: https://staging.edisontech.example.com/api
    description: Staging server
  - url: https://api.edisontech.example.com/api
    description: Production server

tags:
  - name: Authentication
    description: Authentication and authorization endpoints
  - name: Users
    description: User management
  - name: Companies
    description: Company management
  - name: Projects
    description: Project management
  - name: Tasks
    description: Task management
  - name: Time Entries
    description: Time tracking
  - name: Invoices
    description: Invoice management
  - name: Payments
    description: Payment processing
  - name: Documents
    description: Document management
  - name: Contracts
    description: Contract management
  - name: Health
    description: Health check endpoints

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token authentication

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        company_id:
          type: integer
          nullable: true
          example: 5
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        role:
          type: string
          enum: [admin, employee, client]
          example: employee
        phone:
          type: string
          nullable: true
          example: +1234567890
        timezone:
          type: string
          example: America/New_York
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Company:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zip:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        website:
          type: string
          format: uri
          nullable: true
        tax_id:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        id:
          type: integer
        company_id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, planning, active, on_hold, completed, cancelled]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        budget:
          type: number
          format: decimal
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        actual_end_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Task:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        assigned_to:
          type: integer
          nullable: true
        created_by:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, in_progress, completed, on_hold, cancelled]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        due_date:
          type: string
          format: date
          nullable: true
        completed_at:
          type: string
          format: date
          nullable: true
        estimated_hours:
          type: number
          format: decimal
          nullable: true
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Invoice:
      type: object
      properties:
        id:
          type: integer
        company_id:
          type: integer
        project_id:
          type: integer
          nullable: true
        invoice_number:
          type: string
        status:
          type: string
          enum: [draft, sent, viewed, partially_paid, paid, overdue, cancelled]
        issue_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        subtotal:
          type: number
          format: decimal
        tax_amount:
          type: number
          format: decimal
        discount_amount:
          type: number
          format: decimal
        total_amount:
          type: number
          format: decimal
        paid_amount:
          type: number
          format: decimal
        balance:
          type: number
          format: decimal
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        id:
          type: integer
        invoice_id:
          type: integer
        payment_number:
          type: string
        amount:
          type: number
          format: decimal
        payment_method:
          type: string
          enum: [credit_card, debit_card, bank_transfer, paypal, stripe, check, cash]
        payment_date:
          type: string
          format: date
        reference_number:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, completed, failed, refunded, cancelled]
        stripe_payment_id:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Document:
      type: object
      properties:
        id:
          type: integer
        documentable_type:
          type: string
          nullable: true
        documentable_id:
          type: integer
          nullable: true
        uploaded_by:
          type: integer
        name:
          type: string
        filename:
          type: string
        file_path:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
        category:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        is_public:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        timestamp:
          type: string
          format: date-time
        service:
          type: string
        version:
          type: string
        checks:
          type: object
          nullable: true
          properties:
            database:
              type: object
            cache:
              type: object
            storage:
              type: object
            queue:
              type: object

  responses:
    Unauthorized:
      description: Unauthorized - Invalid or missing authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /health:
    get:
      tags:
        - Health
      summary: Basic health check
      description: Returns basic application health status
      security: []
      responses:
        '200':
          description: Application is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'

  /health/comprehensive:
    get:
      tags:
        - Health
      summary: Comprehensive health check
      description: Returns detailed health status of all services
      security: []
      responses:
        '200':
          description: All services are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
        '503':
          description: One or more services are unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'

  /login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and return access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags:
        - Users
      summary: List users
      description: Get paginated list of users with optional filtering
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, employee, client]
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    type: object
                  links:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects:
    get:
      tags:
        - Projects
      summary: List projects
      description: Get paginated list of projects
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: company_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'

  /invoices/{id}:
    get:
      tags:
        - Invoices
      summary: Get invoice details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          $ref: '#/components/responses/NotFound'
